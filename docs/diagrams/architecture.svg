<rect class="svc" x="644" y="188" width="200" height="84" rx="12"/>
<text class="name" x="660" y="220">Git server</text>
<text class="sub" x="660" y="244">controller-as-code</text>
<rect class="svc" x="928" y="188" width="200" height="108" rx="12"/>
