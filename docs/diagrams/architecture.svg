<rect class="svc" x="644" y="404" width="200" height="124" rx="12"/>
<text class="name" x="660" y="436">Controller</text>
<text class="sub" x="660" y="460">0 executors</text>
<text class="sub" x="660" y="482">JCasC applied</text>
<text class="sub" x="660" y="504">runs no builds</text>
<rect class="svc" x="928" y="404" width="200" height="124" rx="12"/>
<text class="name" x="944" y="436">Build agent</text>
<text class="sub" x="944" y="460">docker-agent</text>
<text class="sub" x="944" y="482">2 executors</text>
<text class="sub" x="944" y="504">JDK 21, git</text>
<path class="store" d="M736 652a150 12 0 0 1 300 0v102a150 12 0 0 1 -300 0z"/>
<path class="rim" d="M736 652a150 12 0 0 0 300 0"/>
<text class="name" x="886" y="684" text-anchor="middle">Environment</text>
<text class="sub" x="886" y="706" text-anchor="middle">ADMIN_PASSWORD, PUBLISH_TOKEN</text>
<text class="sub" x="886" y="728" text-anchor="middle">.env, ignored by Git</text>
<rect class="note" x="72" y="580" width="292" height="100" rx="10"/>
<text class="label b t-warn" x="88" y="610">make rebuild-proof</text>
<text class="sub" x="88" y="636">container and volume gone:</text>
<text class="sub" x="88" y="658">same configuration back</text>
<rect class="note" x="392" y="580" width="292" height="100" rx="10"/>
<text class="label b t-warn" x="408" y="610">ECHO_TOKEN=true</text>
<text class="sub" x="408" y="636">the step echoes the token,</text>
<text class="sub" x="408" y="658">the log shows ****</text>
