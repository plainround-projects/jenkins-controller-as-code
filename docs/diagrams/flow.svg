<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="924" viewBox="0 0 1200 924" role="img" aria-labelledby="t d">
<title id="t">One make run through the controller and its pipeline</title>
<desc id="d">Ten rows top to bottom across five lanes. make run starts the controller, the build agent fetches its secret and connects, and make seed pushes the repository to the Git server. The controller schedules Verify on the agent, which checks out and runs parallel tests. In the amber row a broken unit test turns the build red. An optional approval holds no executor, then Publish uploads the jar to the artifact store with the bound token.</desc>
<style>
:root{--paper:#ffffff;--ink:#10243d;--mute:#52677f;--accent:#0a6aa8;--good:#19743f;--warn:#8a5a00}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="923" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="922" rx="16"/>
<text class="title" x="48" y="68">From files to a published jar</text>
<text class="caption" x="48" y="100">make run. Amber: BREAK_A_TEST=true turns the build red, with the report kept and no publish.</text>
<rect class="actor" x="400" y="128" width="120" height="48" rx="24"/>
<text class="lane" x="460" y="158" text-anchor="middle">make run</text>
<rect class="svc" x="535" y="128" width="130" height="48" rx="10"/>
<text class="lane" x="600" y="158" text-anchor="middle">Controller</text>
<rect class="svc" x="679" y="128" width="142" height="48" rx="10"/>
<text class="lane" x="750" y="158" text-anchor="middle">Build agent</text>
<rect class="svc" x="840" y="128" width="130" height="48" rx="10"/>
<text class="lane" x="905" y="158" text-anchor="middle">Git server</text>
<rect class="svc" x="1010" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="1070" y="148" text-anchor="middle">Artifact</text>
<text class="lane" x="1070" y="168" text-anchor="middle">store</text>
<path class="hair" d="M460 176V344M600 176V740M750 176V804M905 176V472M1070 176V804"/>
<path class="hair" d="M66 216V792"/>
<circle class="dot" cx="66" cy="216" r="15"/><text class="num" x="66" y="221" text-anchor="middle">1a</text>
<text class="label b t-ink" x="96" y="212">Compose starts the controller</text>
<text class="sub" x="96" y="232">pinned image, JCasC applied</text>
<path class="sync" d="M460 216H600"/>
<text class="label t-accent" x="476" y="206">up --wait</text>
<circle class="dot" cx="66" cy="280" r="15"/><text class="num" x="66" y="285" text-anchor="middle">1b</text>
<text class="label b t-ink" x="96" y="276">The agent fetches its secret</text>
<text class="sub" x="96" y="296">admin password, then WebSocket</text>
<path class="sync" d="M750 280H600"/>
<text class="label t-accent" x="616" y="270">GET secret</text>
<circle class="dot" cx="66" cy="344" r="15"/><text class="num" x="66" y="349" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="340">seed-project.sh pushes the repo</text>
<text class="sub" x="96" y="360">first build starts, no params</text>
<path class="sync" d="M460 344H905"/>
<text class="label t-accent" x="766" y="334">push snapshot</text>
<circle class="dot" cx="66" cy="408" r="15"/><text class="num" x="66" y="413" text-anchor="middle">3a</text>
<text class="label b t-ink" x="96" y="404">Verify is scheduled on the agent</text>
<text class="sub" x="96" y="424">0 executors here, 2 on the agent</text>
<path class="async" d="M600 408H750"/>
<text class="label t-accent" x="616" y="398">schedule</text>
<circle class="dot" cx="66" cy="472" r="15"/><text class="num" x="66" y="477" text-anchor="middle">3b</text>
<text class="label b t-ink" x="96" y="468">The agent checks out</text>
<text class="sub" x="96" y="488">the workspace, not only the file</text>
<path class="sync" d="M750 472H905"/>
<text class="label t-accent" x="766" y="462">checkout</text>
<circle class="dot" cx="66" cy="536" r="15"/><text class="num" x="66" y="541" text-anchor="middle">3c</text>
<text class="label b t-ink" x="96" y="532">The agent builds and tests</text>
<text class="sub" x="96" y="552">lint, build, Unit and Integration</text>
<rect class="slot" x="744" y="518" width="12" height="36" rx="4"/>
<text class="label t-accent" x="766" y="541">parallel tests</text>
<circle class="dot-w" cx="66" cy="600" r="15"/><text class="num" x="66" y="605" text-anchor="middle">3x</text>
<text class="label b t-warn" x="96" y="596">BREAK_A_TEST: one test fails</text>
<text class="sub" x="96" y="616">red build, report kept, no jar</text>
<path class="fail" d="M750 600H600"/>
<text class="label t-warn" x="616" y="590">FAILURE</text>
<circle class="dot" cx="66" cy="664" r="15"/><text class="num" x="66" y="669" text-anchor="middle">4</text>
<text class="label b t-ink" x="96" y="660">Approve holds no executor</text>
<text class="sub" x="96" y="680">agent none, only with the flag</text>
<rect class="slot" x="594" y="646" width="12" height="36" rx="4"/>
<text class="label t-accent" x="616" y="669">wait: input</text>
<circle class="dot" cx="66" cy="728" r="15"/><text class="num" x="66" y="733" text-anchor="middle">5a</text>
<text class="label b t-ink" x="96" y="724">Publish runs on the agent</text>
<text class="sub" x="96" y="744">unstash jar, bind publish-token</text>
<path class="async" d="M600 728H750"/>
<text class="label t-accent" x="616" y="718">Publish</text>
<circle class="dot-g" cx="66" cy="792" r="15"/><text class="num" x="66" y="797" text-anchor="middle">5b</text>
<text class="label b t-ink" x="96" y="788">publish.sh uploads the jar</text>
<text class="sub" x="96" y="808">token read from standard input</text>
<path class="sync" d="M750 792H1070"/>
<text class="label t-accent" x="921" y="782">PUT, Bearer</text>
<rect class="slot" x="744" y="774" width="12" height="36" rx="4"/>
<path class="ok" d="M744 792H706"/>
<rect class="win" x="506" y="772" width="200" height="40" rx="10"/>
<text class="label b t-good" x="522" y="797">publish: stored</text>
<path class="sync" d="M48 880H112"/><text class="legend" x="124" y="885">sync call</text>
<path class="async" d="M264 880H328"/><text class="legend" x="340" y="885">async message</text>
<path class="fail" d="M696 880H760"/><text class="legend" x="772" y="885">failure path</text>
<path class="ok" d="M928 880H992"/><text class="legend" x="1004" y="885">result</text>
</svg>
